[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-lens"
version = "0.1.0"
description = "Governed medallion data pipeline for Urban-Lens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.37",
  "mlflow>=2.20",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.1",
  "scikit-learn>=1.6",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",
  "pymilvus>=2.4.1",
  "PyJWT>=2.8",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
urban-lens-ingest = "urban_lens.cli.ingest_manual:main"
urban-lens-process-snapshot = "urban_lens.cli.process_snapshot:main"
urban-lens-bronze-to-silver = "urban_lens.cli.bronze_to_silver:main"
urban-lens-silver-to-gold = "urban_lens.cli.silver_to_gold:main"
urban-lens-train-forecast = "urban_lens.cli.train_forecast_model:main"
urban-lens-index-embeddings = "urban_lens.cli.index_embeddings:main"
urban-lens-index-docs = "urban_lens.cli.index_docs:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

