[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-lens"
version = "0.1.0"
description = "Governed medallion data pipeline for Urban-Lens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.37",
  "mlflow>=2.20",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.1",
  "scikit-learn>=1.6",
  "fastapi>=0.110.0", 
  "uvicorn>=0.29.0",  
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",  
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

