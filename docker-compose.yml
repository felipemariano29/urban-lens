services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ./docker-data/postgres
        target: /var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - type: bind
        source: ./docker-data/pgadmin
        target: /var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - app_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ./docker-data/minio
        target: /data
    networks:
      - app_network

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando o MinIO iniciar...';
      sleep 8;
      /usr/bin/mc alias set myminio http://minio-storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/$${MINIO_DEFAULT_BUCKET} --ignore-existing;
      echo 'Setup concluído!';
      exit 0;
      "
    networks:
      - app_network

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - minio-setup
    env_file: .env
    environment:
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "5000"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}"
      MLFLOW_ARTIFACT_ROOT: "s3://${MINIO_DEFAULT_BUCKET}/mlflow"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: "${URBAN_LENS_S3_REGION:-us-east-1}"
      MLFLOW_S3_ENDPOINT_URL: "http://minio-storage:9000"
      AWS_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${MLFLOW_HOST_PORT:-5005}:5000"
    networks:
      - app_network

  rag-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - mlflow
    env_file: .env
    environment:
      URBAN_LENS_POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}"
      URBAN_LENS_S3_ENDPOINT_URL: "http://minio-storage:9000"
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
    ports:
      - "${RAG_API_HOST_PORT:-8000}:8000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
