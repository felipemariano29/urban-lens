services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ./docker-data/postgres
        target: /var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - type: bind
        source: ./docker-data/pgadmin
        target: /var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - app_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ./docker-data/minio
        target: /data
    networks:
      - app_network

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/minio-setup.sh"]
    volumes:
      - ./docker/scripts/minio-setup.sh:/scripts/minio-setup.sh:ro
    networks:
      - app_network

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - minio-setup
    env_file: .env
    environment:
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "5000"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}"
      MLFLOW_ARTIFACT_ROOT: "s3://${MINIO_DEFAULT_BUCKET}/mlflow"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: "${URBAN_LENS_S3_REGION:-us-east-1}"
      MLFLOW_S3_ENDPOINT_URL: "http://minio-storage:9000"
      AWS_S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${MLFLOW_HOST_PORT:-5005}:5000"
    networks:
      - app_network

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_ADDRESS: minio-storage:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: milvus
    depends_on:
      - minio
      - minio-setup
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      - "${MILVUS_REST_PORT:-9091}:9091"
    volumes:
      - type: bind
        source: ./docker-data/milvus
        target: /var/lib/milvus
      - ./docker/milvus/user.yaml:/milvus/configs/user.yaml:ro
    networks:
      - app_network

  attu:
    image: zilliz/attu:v2.4.12
    container_name: attu
    restart: unless-stopped
    depends_on:
      - milvus
    environment:
      MILVUS_ADDRESS: "milvus-standalone:19530"
      ATTU_DB_PATH: "/data/attu.db"
    ports:
      - "${ATTU_HOST_PORT:-3001}:3000"
    volumes:
      - type: bind
        source: ./docker-data/attu
        target: /data
    networks:
      - app_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-4}"
    volumes:
      - type: bind
        source: ./docker-data/ollama
        target: /root/.ollama
    networks:
      - app_network

  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "/scripts/ollama-setup.sh"]
    volumes:
      - ./docker/scripts/ollama-setup.sh:/scripts/ollama-setup.sh:ro
    networks:
      - app_network

  rag-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - mlflow
      - milvus
      - ollama
    env_file: .env
    environment:
      URBAN_LENS_POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}"
      URBAN_LENS_S3_ENDPOINT_URL: "http://minio-storage:9000"
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
      URBAN_LENS_MILVUS_URI: "http://milvus-standalone:19530"
      URBAN_LENS_OLLAMA_BASE_URL: "http://ollama:11434"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${RAG_API_HOST_PORT:-8000}:8000"
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: urban-lens-web
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    environment:
      PORT: "3000"
      URBAN_LENS_API_BASE_URL: "http://rag-api:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
